server {
    listen       80;
    server_name  localhost;

    # Proxy API calls to the backend container. Only relevant for local
    # docker-compose setups: in Kubernetes, the Ingress routes /api directly
    # to the backend Service and never reaches this container. The resolver
    # + variable combo defers DNS lookup to request time so a missing "api"
    # host (e.g. outside docker-compose) can't fail nginx startup.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $backend_upstream http://api:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Service Worker - no caching
    location /sw.js {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Web App Manifest
    location /manifest.webmanifest {
        root   /usr/share/nginx/html;
        add_header Content-Type "application/manifest+json";
        add_header Cache-Control "public, max-age=86400";
    }

    # PWA Register SW
    location /registerSW.js {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Error pages
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
